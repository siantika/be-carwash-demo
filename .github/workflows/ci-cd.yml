name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carwash_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carwash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key
      ALGORITHM: HS256
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/carwash_test
      DB_NAME: carwash_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      PORT: "8000"
      HOST: 0.0.0.0
      API_VERSION: /api/v1
      OTEL_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run lint
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest

  publish-image:
    name: Publish Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to VPS
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull and restart API
        run: |
          ssh -o BatchMode=yes sian@76.13.21.1 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/carwash-api

          docker pull ghcr.io/siantika/be-carwash-demo:latest
          docker tag \
            ghcr.io/siantika/be-carwash-demo:latest \
            ghcr.io/siantika/carwash-api:latest
          docker compose -f docker-compose.prod.yml up -d --no-deps --pull never api

          container_id="$(docker compose -f docker-compose.prod.yml ps -q api)"
          if [ -z "$container_id" ]; then
            echo "API container was not created"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8001/api/v1/health
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose -f docker-compose.prod.yml logs --tail=100 api
              exit 1
            fi
            sleep 3
          done

          docker compose -f docker-compose.prod.yml logs --tail=100 api
          echo "Timed out waiting for a healthy API container"
          exit 1
          REMOTE
